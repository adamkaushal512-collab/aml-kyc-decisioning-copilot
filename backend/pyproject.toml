[project]
name = "aml-kyc-decisioning-copilot"
version = "0.1.0"
description = "Agentic pipeline for auditable, cited AML/KYC risk decisions"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "pydantic",
    "asyncpg",
    "pgvector",
    "ragas",
    "langfuse",
    "sentence-transformers",
    "rapidfuzz",
    "scikit-learn",
    "python-dotenv",
    # Pinned: langchain-community>=0.4.2 dropped the vertexai chat-model shim
    # that ragas 0.4.3 still imports unconditionally, which breaks `import
    # ragas`. Unpin once ragas releases a fix.
    "langchain-community==0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "api"]

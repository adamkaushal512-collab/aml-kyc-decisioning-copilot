[project]
name = "aml-kyc-decisioning-copilot"
version = "0.1.0"
description = "Agentic pipeline for auditable, cited AML/KYC risk decisions"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "pydantic",
    "asyncpg",
    "pgvector",
    "ragas",
    "langfuse",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "api"]
